<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <g id="field">
    <g>
    <rect id="field_w" y="0" width="42" height="100" fill="#6c0"/>
    <rect id="field_e" x="58" y="0" width="42" height="100" fill="#6c0"/>
  </g>
</g>
<g id="road">
  <rect id="road_ns" x="42" width="16" height="100" fill="#e6e6e6"/>
</g>
<g id="roadBorder">
  <line x1="57.5" y1="100" x2="57.5" y2="0" fill="#e6e6e6" stroke="#b3b3b3" stroke-miterlimit="10"/>
  <line x1="42.5" y1="100" x2="42.5" y2="0" fill="#e6e6e6" stroke="#b3b3b3" stroke-miterlimit="10"/>
</g>
<g id="highlights" class="highlights-layer" style="pointer-events: none;">
  <rect y="0" width="42" height="100" fill="var(--player-color, white)" opacity="0" data-feature="field_w" class="highlight"/>
  <rect x="58" y="0" width="42" height="100" fill="var(--player-color, white)" opacity="0" data-feature="field_e" class="highlight"/>
  <rect x="42" width="16" height="100" fill="var(--player-color, white)" opacity="0" data-feature="road_ns" class="highlight"/>
</g>
</svg>