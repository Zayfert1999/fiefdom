<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <g id="b" data-name="field">
    <polygon id="c" data-name="field_sw" points="100 100 0 100 0 0 100 100" fill="#6c0"/>
    <polygon id="d" data-name="field_sw" points="100 100 0 100 0 0 100 100" fill="#6c0"/>
  </g>
  <g id="g" data-name="city">
    <polygon id="h" data-name="city_ne" points="100 0 100 100 0 0 100 0" fill="#960"/>
    <polygon id="i" data-name="city_ne" points="100 0 100 100 0 0 100 0" fill="#960"/>
  </g>
  <g id="j" data-name="cityBorder">
    <line x1="100" y1="100" fill="none" stroke="#d1bc8d" stroke-miterlimit="10" stroke-width="2"/>
  </g>



<g id="highlights" class="highlights-layer" style="pointer-events: none;">
  <polygon points="100 100 0 100 0 0 100 100" fill="var(--player-color, white)" class="highlight" data-feature="field_sw" stroke="none" opacity="0"/>
  <polygon points="100 0 100 100 0 0 100 0" fill="var(--player-color, white)" class="highlight" data-feature="city_ne" stroke="none" opacity="0"/>
</g>
</svg>